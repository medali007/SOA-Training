<div class="container mt-5">
  <div class="row">
    <div class="col-md-12">
      <h1>Gestion des Unités d'Enseignement</h1>
      <button class="btn btn-primary mb-3" (click)="addUE()">
        ➕ Ajouter une UE
      </button>

      <div *ngIf="loading" class="alert alert-info">
        ⏳ Chargement des unités d'enseignement...
      </div>

      <div *ngIf="error" class="alert alert-danger">
        ❌ {{ error }}
      </div>

      <table class="table table-striped table-hover" *ngIf="unitesEnseignement.length > 0 && !loading">
        <thead class="table-dark">
          <tr>
            <th>Code</th>
            <th>Domaine</th>
            <th>Responsable</th>
            <th>Crédits</th>
            <th>Semestre</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let ue of unitesEnseignement">
            <td><strong>{{ ue.code }}</strong></td>
            <td>{{ ue.domaine }}</td>
            <td>{{ ue.responsable }}</td>
            <td>
              <span class="badge bg-success">{{ ue.credits }} crédits</span>
            </td>
            <td>
              <span class="badge bg-info">S{{ ue.semestre }}</span>
            </td>
            <td>
              <button class="btn btn-sm btn-warning me-2" (click)="editUE(ue.code)">
                ✏️ Éditer
              </button>
              <button class="btn btn-sm btn-danger" (click)="deleteUE(ue.code)">
                🗑️ Supprimer
              </button>
            </td>
          </tr>
        </tbody>
      </table>

      <p *ngIf="unitesEnseignement.length === 0 && !loading" class="alert alert-warning">
        ⚠️ Aucune unité d'enseignement trouvée
      </p>
    </div>
  </div>
</div>
